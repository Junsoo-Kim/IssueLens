# 앱 공통 설정
app:
  name: IssueLens
  version: 0.1.0

llm:
  model: gpt-5-mini         # 답변 생성 모델, API 주소는 .env의 OPENAI_BASE_URL
                            # GPT-5 계열은 temperature 기본값(1)만 지원하므로 지정하지 않는다
  reasoning_effort: low     # 추론 모델의 생각 양 (minimal/low/medium/high). 기본값(medium)은 질문당 1분 넘게 걸린다
                            # 주소가 이 값을 받지 않으면 한 번 경고하고 빼고 다시 호출한다
  fast_reasoning_effort: minimal  # 검색어 추출·후보 선별·조건 추출 (근거 판정과 답변 생성은 위 값)

http:                       # 기획서 5.7절, request_interval_seconds는 내부 초기값
  connect_timeout_seconds: 5
  read_timeout_seconds: 20
  max_retries: 5
  backoff_factor: 2
  request_interval_seconds: 0.5
  search_interval_seconds: 2.0   # Search API는 분당 30회 한도라 별도 간격을 둔다

collection:
  max_linked_prs: 5         # 이슈당 연결 PR 상세 수집 상한

rag:
  max_attempts: 3           # ① 원래 질문 ② 프롬프트 1 재작성 검색어 ③ 질문 시점 외부 수집 후 재검색
  allow_general_answer: false   # 근거 부족 시 RAG 미사용 일반 답변을 분리 섹션으로 덧붙일지 (기본 꺼짐)
  evidence_chars: 1200      # 프롬프트 3에 넣는 근거 1건당 최대 글자 수
  citation_retries: 1       # 존재하지 않는 근거 번호를 인용하면 다시 생성하는 횟수

query_time_collection:      # 요구사항 F2003·F2004·NF2002
  enabled: true
  results_per_query: 10     # GitHub 검색 결과에서 프롬프트 2에 보여 줄 후보 수
  max_queries: 3
  max_selected: 3           # 프롬프트 2가 고를 수 있는 최대 이슈 수

paths:
  raw_dir: data/raw/github
  processed_dir: data/processed
  cache_dir: data/cache
  manifest_dir: data/manifests
  eval_dir: data/eval
  chroma_dir: chroma_db
  sparse_index_dir: sparse_index

safety_notice: >-
  이 답변은 공개 이슈와 문서를 검색해 제공하는 기술 조사 보조 결과입니다.
  생성된 명령과 코드 변경은 저장소의 기여 규칙을 확인하고 격리된 환경에서
  재현 테스트를 수행한 뒤 적용해야 합니다.
